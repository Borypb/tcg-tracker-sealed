name: probe-lang4
on:
  push:
    branches: [probe-lang4]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for p in jp en tc th asia-tc asia-th cn kr; do echo "$p $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://www.dbs-cardgame.com/fw/images/cards/card/$p/FB11-002.webp)" >> img.txt; done
          curl -sSL -o tc.html "https://www.dbs-cardgame.com/fw/asia-tc/cardlist/?search=true&category%5B0%5D=596011"
          grep -o 'data-src="[^"]*webp"' tc.html | head -3 >> img.txt
          curl -sSL -o en.html "https://www.dbs-cardgame.com/fw/en/cardlist/?search=true&category%5B0%5D=583011"
          grep -o 'data-src="[^"]*webp"' en.html | head -3 >> img.txt
          for l in en-us de-de es-es it-it ja-jp ko-kr zh-cn zh-tw pt-br; do echo "rift $l $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://playriftbound.com/$l/card-gallery/)" >> img.txt; done
          curl -sSL -o rift_en.html "https://playriftbound.com/en-us/card-gallery/"
          cat img.txt
      - run: |
          cd out
          git init -q && git checkout -q -b probe-lang4-out
          git config user.email probe@example.invalid && git config user.name probe
          git add . && git commit -qm sonde
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-lang4-out
