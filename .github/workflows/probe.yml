name: Sonde temporaire (à supprimer)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Pages pokemon-card.com
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (tcg-tracker-sealed probe)"
          B=https://www.pokemon-card.com
          for t in expansion construction others; do
            curl -sSL -A "$UA" -m 30 -o list-$t.html -w "$t %{http_code}\n" "$B/products/index.html?productType=$t" >> status.txt || true
          done
          # scripts appelés par la page de liste
          grep -oE 'src="[^"]+\.js[^"]*"' list-expansion.html | sed 's/src="//;s/"$//' | sort -u > scripts.txt || true
          i=0
          while read -r js; do
            i=$((i+1)); case "$js" in http*) u="$js";; /*) u="$B$js";; *) u="$B/products/$js";; esac
            curl -sSL -A "$UA" -m 30 -o "script-$i.js" "$u" || true
            echo "$i $u" >> scripts-map.txt
          done < scripts.txt
          # pistes d'API dans les scripts
          grep -hoE '["'"'"'](/[a-zA-Z0-9_./-]*(api|json|list|product)[a-zA-Z0-9_./?=&-]*)["'"'"']' script-*.js list-*.html | sort -u > endpoints.txt || true
      - name: Déposer sur une branche temporaire
        run: |
          cd out
          git init -q -b probe-output
          git config user.name probe && git config user.email probe@example.invalid
          git add -A && git commit -qm "sonde"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
