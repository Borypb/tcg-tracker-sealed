name: Sonde temporaire (à supprimer)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Cardmarket scellé + cote filtrée
        run: |
          mkdir out && cd out
          B=https://downloads.s3.cardmarket.com/productCatalog
          curl -sSL -m 120 -o ns.json "$B/productList/products_nonsingles_6.json"
          curl -sSL -m 180 -o pg.json "$B/priceGuide/price_guide_6.json"
          python3 - <<'PY'
          import json
          ns=json.load(open('ns.json')); pg=json.load(open('pg.json'))
          ids={p['idProduct'] for p in ns['products']}
          json.dump(ns, open('nonsingles.json','w'), ensure_ascii=False)
          json.dump({'createdAt': pg.get('createdAt'), 'priceGuides':[x for x in pg['priceGuides'] if x['idProduct'] in ids]}, open('pg-nonsingles.json','w'))
          PY
          rm ns.json pg.json
      - name: Déposer sur une branche temporaire
        run: |
          cd out
          git init -q -b probe-output
          git config user.name probe && git config user.email probe@example.invalid
          git add -A && git commit -qm "sonde"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
