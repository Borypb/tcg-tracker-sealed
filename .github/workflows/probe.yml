name: Sonde temporaire (à supprimer)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CORS PSA / CGC
        run: |
          mkdir out && cd out
          for u in https://api.psacard.com/publicapi/cert/GetByCertNumber/00000000 https://api.gemrate.com/v1/certs/psa/00000000; do
            echo "== $u" >> psa.txt
            curl -s -m 30 -D - -o /dev/null -X OPTIONS -H "Origin: https://tcg-tracker.example" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,x-api-key" "$u" | tr -d '\r' | grep -iE "^HTTP|^access-control" >> psa.txt || true
            curl -s -m 30 -D - -o body.txt -H "Origin: https://tcg-tracker.example" "$u" | tr -d '\r' | grep -iE "^HTTP|^access-control|^server" >> psa.txt || true
            head -c 300 body.txt >> psa.txt; echo >> psa.txt
          done
      - name: Déposer sur une branche temporaire
        run: |
          cd out
          git init -q -b probe-output
          git config user.name probe && git config user.email probe@example.invalid
          git add -A && git commit -qm "sonde"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
