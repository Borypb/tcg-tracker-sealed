name: Sonde temporaire (à supprimer)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: API produits pokemon-card.com
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (tcg-tracker-sealed probe)"
          B=https://www.pokemon-card.com/products/resultAPI.php
          for q in "productType=expansion&page=1" "productType=expansion&page=2" "productType=construction&page=1" "productType=others&page=1" "page=1"; do
            f=$(echo "$q" | tr '=&' '-_').json
            curl -sSL -A "$UA" -e "https://www.pokemon-card.com/products/index.html" -m 30 -o "$f" -w "$q %{http_code} %{size_download}\n" "$B?$q" >> status.txt || true
          done
      - name: Déposer sur une branche temporaire
        run: |
          cd out
          git init -q -b probe-output
          git config user.name probe && git config user.email probe@example.invalid
          git add -A && git commit -qm "sonde"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
