name: Mise à jour du catalogue

on:
  schedule:
    # Cardmarket publie ses fichiers vers 2 h 48 (heure de Paris) : on passe au moins 2 h après.
    # 3 h 50 UTC = 5 h 50 à Paris l'été, 4 h 50 l'hiver.
    - cron: "50 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "catalogue-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Catalogue : mise à jour automatique $(date -u +%F)"
            git push
          fi
